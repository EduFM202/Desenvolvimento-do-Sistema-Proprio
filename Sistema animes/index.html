<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniWorld</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Titillium+Web:wght@900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/pages/index.css" />
  </head>

  <body>
    <div class="container">
      <section class="hero-grid">
        <div class="hero-banner">
          <div class="user-bar">
            <span>Olá, <strong>aniWorld</strong></span>
            <a href="login.html" class="btn-sair">Sair</a>
          </div>

          <div class="brand-corner">
            <h1>Ani<span>World</span></h1>
          </div>
          <img src="assets/banner.jpeg" alt="castelo" class="banner-img" />
        </div>

        <aside class="premium-card">
          <div class="premium-header">
            <h2>Assine o Premium</h2>
            <p>assista sem limites</p>
          </div>

          <div class="plan-list">
            <a href="#" class="plan-item">
              <span class="plan-name">Família</span>
              <span class="plan-price">R$ 30/mês</span>
            </a>
            <a href="#" class="plan-item">
              <span class="plan-name">Individual</span>
              <span class="plan-price">R$ 25/mês</span>
            </a>
            <a href="#" class="plan-item">
              <span class="plan-name">Universitário</span>
              <span class="plan-price">R$ 16/mês</span>
            </a>
          </div>
        </aside>

        <div class="category-cards">
          <a href="cadastro_estudio.html" class="cat-card">Estúdio</a>
          <a href="cadastro_anime.html" class="cat-card">Anime</a>
          <a href="listagem_animes.html" class="cat-card">Biblioteca</a>
        </div>
      </section>

      <hr class="section-divider" />

      <section class="most-searched">
        <h2>Animes mais procurados</h2>

        <div class="anime-grid">
          <a href="listagem_animes.html" class="anime-card">
            <img src="assets/solo-leveling.png" alt="Solo Leveling" />
            <span>Solo Leveling</span>
          </a>

          <a href="listagem_animes.html" class="anime-card">
            <img src="assets/one-piece.png" alt="One Piece" />
            <span>One Piece</span>
          </a>

          <a href="listagem_animes.html" class="anime-card">
            <img src="assets/tokyo-ghoul.png" alt="Tokyo Ghoul" />
            <span>Tokyo Ghoul</span>
          </a>

          <a href="listagem_animes.html" class="anime-card">
            <img src="assets/black-clover.png" alt="Black Clover" />
            <span>Black Clover</span>
          </a>

          <a href="listagem_animes.html" class="anime-card">
            <img
              src="assets/fullmetal.png"
              alt="Fullmetal Alchemist: Brotherhood"
            />
            <span>Fullmetal Alchemist: Brotherhood</span>
          </a>
        </div>
      </section>
    </div>
  </body>
</html>
