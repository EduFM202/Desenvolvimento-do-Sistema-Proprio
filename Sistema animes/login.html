<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — AniWorld</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Titillium+Web:wght@900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/pages/login.css" />
  </head>

  <body class="login-page">
    <div class="login-card">
      <div class="login-header">
        <h1>Ani<span>World</span></h1>
        <p>Entre com suas credenciais</p>
      </div>

      <form method="post" action="#">
        <div class="form-group">
          <label for="usuario">Usuário</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            required
            autocomplete="username"
            placeholder="Username"
          />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            required
            autocomplete="current-password"
            placeholder="Senha"
          />
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <div class="login-hint">
        <strong>Credenciais de teste:</strong><br />
        Usuário: <code>aniWorld</code> &nbsp;·&nbsp; Senha: <code>202</code>
      </div>
    </div>
  </body>
</html>
